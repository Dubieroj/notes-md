# Unit tests of the core (swift test) on every push and pull request. The full build with
# extensions and the app checks (tools/check*.sh) need signing and a window, so they run locally.
name: Tests

on:
  push:
  pull_request:

jobs:
  swift-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Newest Xcode on the runner (not a beta)
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test
